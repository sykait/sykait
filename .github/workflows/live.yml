name: Live panels

on:
  schedule:
    - cron: "23 */8 * * *"   # three times a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/live.yml"]

permissions:
  contents: write

concurrency:
  group: live-panels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: tools/.fonts
          key: fonts-v1
      - run: pip install fonttools pillow
      - run: python tools/live.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed panels
        run: |
          git config user.name "sykait"
          git config user.email "141525266+sykait@users.noreply.github.com"
          git add assets/live-*.svg tools/data/status-history.json tools/data/bot-stats.json
          git diff --cached --quiet || (git commit -m "chore: refresh live panels" && git push)
